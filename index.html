<!doctype html>
<html lang="pt-BR">

<style>

@media (max-width:560px){body:not(.pdf) .hd,body:not(.pdf) .blk{padding-left:18px;padding-right:18px}body:not(.pdf) .hd .logo{right:18px}body:not(.pdf) .ft{padding:14px 18px}body:not(.pdf) .it{grid-template-columns:24px minmax(0,1fr)}body:not(.pdf) .it .n{display:none}body:not(.pdf) .it .dt,body:not(.pdf) .it .pv{grid-column:2;text-align:left}body:not(.pdf) .it .pv:empty{display:none}body:not(.pdf) .it.lh{display:none}}

<body>
<header class="hd">
  <div class="strip"></div><div class="line"></div>
  <img class="logo" src="logo_taking.png" alt="Taking">
  <div class="kick">Checklist de Implantação · Infraestrutura de Rede</div>
  <h1>Adequação de Infraestrutura · Clínicas de Diálise</h1>
  <p class="sub">Acompanhamento das atividades de cada clínica, atualizado a partir do Excel do projeto.</p>
  <div class="tools">
    <div class="sb"><input id="q" list="cl" placeholder="Buscar clínica" aria-label="Buscar clínica" autocomplete="off"><datalist id="cl"></datalist></div>
    <button class="btn" id="exp" type="button" title="Baixa o PDF da tela atual">Exportar PDF</button>
    <div class="snap" id="snap"></div>
  </div>
</header>
<main id="app"><div class="empty">Carregando…</div></main>
<footer>
  <div class="ft"><span id="f1">© 2026 – GRUPO TAKING · CHECKLIST DAS CLÍNICAS</span><span id="f2"></span></div>
  <div class="blocks"><i style="background:#000"></i><i style="background:#D8342A"></i><i style="background:#FF692D"></i></div>
</footer>

<script src="html2canvas.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fD = iso => iso ? iso.split('-').reverse().join('/') : '';
const fDC = iso => iso ? iso.slice(8) + '/' + iso.slice(5, 7) : '';
const P = v => Math.round(v * 100);
const nf = n => Number(n).toLocaleString('pt-BR');
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
let D = null;

// Esperado pelo cronograma: atividades com data prevista até hoje / atividades aplicáveis (a barra sobe no dia da data)
// janela da semana: hoje + 6 dias (7 dias contando hoje). Atividade com data além disso ainda não entra no esperado.
function hojeISO() { const h = new Date(); h.setDate(h.getDate() + 6); const p = n => String(n).padStart(2, '0'); return h.getFullYear() + '-' + p(h.getMonth() + 1) + '-' + p(h.getDate()); }
function espN(c) {
  const cr = c.previsto; if (!cr) return null;
  const h = hojeISO(); let e = 0;
  D.atividades.forEach((a, i) => { if (c.status[i] !== 'NA' && cr[i] && cr[i] <= h) e++; });
  return e;
}
function esp(cs) {
  let e = 0, a = 0, tem = false;
  cs.forEach(c => { const n = espN(c); if (n !== null) { tem = true; e += n; } a += c.aplicaveis; });
  return tem && a ? e / a : null;
}
function espC(c) { const n = espN(c); return n === null ? null : (c.aplicaveis ? n / c.aplicaveis : 0); }
function barra(real, e) {
  if (e === null) return `<span class="bt"><i style="width:${P(real)}%"></i></span>`;
  return `<span class="bt dual" title="Realizado ${P(real)}% · Esperado ${P(e)}%"><i class="e" style="width:${P(e)}%"></i><i class="r" style="width:${P(real)}%"></i><b style="left:calc(${P(e)}% - 1.5px)"></b></span>`;
}

function rota() {
  const m = location.hash.match(/^#\/c\/(.+)$/);
  return m ? D.clinicas.find(c => c.id === decodeURIComponent(m[1])) || null : null;
}

function pad2(n) { return String(n).padStart(2, '0'); }
function isoDia(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
// Tarefas agendadas na semana (de hoje até hoje+6) e quantas dessas já foram executadas
function tarefasSemana() {
  const a = isoDia(new Date()), b = hojeISO(); let t = 0, x = 0;
  D.clinicas.forEach(c => {
    if (!c.previsto) return;
    D.atividades.forEach((_, i) => {
      const d = c.previsto[i], s = c.status[i];
      if (!d || s === 'NA' || d < a || d > b) return;
      t++; if (s) x++;
    });
  });
  return {t, x, fim: b};
}
// Últimas tarefas executadas: data mais recente, quantas nesse dia e quantas nos últimos 7 dias
function ultimasTarefas() {
  const datas = [];
  D.clinicas.forEach(c => c.status.forEach(s => { if (s && s !== 'NA') datas.push(s); }));
  if (!datas.length) return null;
  const ult = datas.reduce((m, d) => d > m ? d : m);
  const h = new Date(); h.setDate(h.getDate() - 6); const ini = isoDia(h);
  return {data: ult, n: datas.filter(d => d === ult).length, sem: datas.filter(d => d >= ini).length};
}

function addDias(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoDia(d); }
// Semanas do calendário do cronograma (Semana 1 = início da 1ª onda, blocos de 7 dias até o prazo do projeto).
// A fileira mostra só as semanas da onda atual. Estados do bloco:
//  - semana encerrada sem pendência (todas as tarefas previstas com data real): VERDE;
//  - semana encerrada com pendência: borda LARANJA (ao concluir a pendência volta a ficar só verde);
//  - semana em andamento: vai ficando laranja conforme os dias passam (fica verde se concluir tudo antes).
function diasEntre(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5); }
function semanasInfo(o, origem, fimProj) {
  if (!o.inicio || !origem || !fimProj) return null;
  const hoje = isoDia(new Date()), w0 = Math.max(0, Math.floor(diasEntre(origem, o.inicio) / 7)), w1 = Math.floor(diasEntre(origem, fimProj) / 7);
  const real = {};
  o.cs.forEach(c => {
    if (!c.previsto) return;
    D.atividades.forEach((_, i) => {
      const p = c.previsto[i], st = c.status[i];
      if (!p || st === 'NA') return;
      const w = Math.max(0, Math.floor(diasEntre(origem, p) / 7));
      (real[w] = real[w] || {t: 0, x: 0}).t++;
      if (st) real[w].x++;
    });
  });
  const blocos = [];
  for (let w = w0; w <= w1; w++) {
    const de = addDias(origem, 7 * w), ate = addDias(origem, 7 * w + 6), r = real[w] || {t: 0, x: 0};
    blocos.push({w, de, ate, t: r.t, x: r.x, encerrada: ate < hoje, atual: de <= hoje && hoje <= ate, dias: Math.min(7, Math.max(0, diasEntre(de, hoje) + 1))});
  }
  const atual = blocos.findIndex(b => b.atual);
  const n = blocos.length;
  const pos = atual >= 0 ? atual + 1 : (hoje < blocos[0].de ? 0 : n);
  return {blocos, n, pos, comeca: blocos[0].de};
}
function blocosHtml(o, origem, fimProj) {
  const inf = semanasInfo(o, origem, fimProj);
  if (!inf) return '';
  const h = inf.blocos.map(b => {
    const pend = b.t - b.x, completo = b.t > 0 && pend === 0;
    let cls = 'wk', bg = '';
    if (b.encerrada) cls += completo ? ' ok' : (b.t > 0 ? ' pend' : '');
    else if (completo) cls += ' ok';
    else if (b.atual) { const lar = Math.round(b.dias / 7 * 100); bg = ` style="background:linear-gradient(to right,var(--orange) ${lar}%,#fff ${lar}%)"`; }
    const tip = `Semana ${b.w + 1} (${fDC(b.de)} a ${fDC(b.ate)})` + (b.t ? `: ${b.x} de ${b.t} tarefas previstas concluídas` + (b.encerrada && pend ? ' · com pendência' : '') : ': sem tarefas previstas');
    return `<span class="${cls}" title="${esc(tip)}"${bg}></span>`;
  }).join('');
  return `<div class="wks">${h}</div>`;
}
function semanaTxt(o, origem, fimProj) {
  const inf = semanasInfo(o, origem, fimProj);
  if (!inf) return '';
  return inf.pos === 0 ? 'começa em ' + fDC(inf.comeca) : `Semana ${inf.pos}/${inf.n}`;
}

function kpiG() {
  const g = D.geral, e = esp(D.clinicas);
  // fase do projeto: uma seta por onda; a atual é a primeira que ainda não terminou (ao acabar uma, passa para a seguinte)
  const nos = ondas().filter(o => /^\d/.test(o.nome) && o.ap > 0).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR', {numeric: true}));
  const oa = nos.find(o => o.conc < o.ap) || nos[nos.length - 1] || null;
  const origemSem = nos.map(o => o.inicio).filter(Boolean).sort()[0], fimProjSem = nos.map(o => o.prazo).filter(Boolean).sort().pop();
  const setas = nos.map((o, i) => `<div class="fs"><span class="ar ${o.conc >= o.ap ? 'done' : (o === oa ? 'cur' : 'fut')}${i === 0 ? ' f' : ''}" title="${esc(o.nome)}">${i + 1}</span></div>`).join('');
  const sem = tarefasSemana(), ult = ultimasTarefas(), temCrono = D.clinicas.some(c => c.previsto);
  return `<section class="kpis">
  <div class="kpi"><div class="v o">${P(g.pct)}%</div><div class="l">Evolução do projeto${e === null ? '' : ' · esperado da semana ' + P(e) + '%'}</div>${e === null ? `<div class="tr"><div class="bt" style="height:8px"><i style="width:${P(g.pct)}%"></i></div></div>` : `<div style="margin-top:10px">${barra(g.pct, e).replace('class="bt dual"', 'class="bt dual" style="height:8px"')}</div>`}</div>
  <div class="kpi fase"><div class="l" style="margin:0 0 8px">Fase do projeto${oa ? ' · ' + esc(oa.nome) : ''}${oa ? ' <b class="sx">' + esc(semanaTxt(oa, origemSem, fimProjSem)) + '</b>' : ''}</div><div class="arrows">${setas}</div>${oa ? blocosHtml(oa, origemSem, fimProjSem) : ''}<div class="nt">Cada bloco representa uma semana.</div><div class="pr"><div><small>Prev.</small><b>${oa && oa.esp !== null ? P(oa.esp) + '%' : '—'}</b></div><div><small>Real</small><b>${oa ? P(oa.pct) + '%' : '—'}</b></div></div></div>
  <div class="kpi"><div class="v">${g.clinicas_concluidas}</div><div class="l">Clínicas 100% concluídas de ${g.clinicas_total}</div></div>
  <div class="kpi"><div class="v">${temCrono ? nf(sem.t) : '—'}</div><div class="l">${temCrono ? 'Próximas tarefas agendadas · ' + nf(sem.x) + ' executadas de ' + nf(sem.t) + ' · até ' + fDC(sem.fim) : 'Próximas tarefas agendadas · cronograma ainda não preenchido'}</div></div>
  <div class="kpi"><div class="v">${ult ? nf(ult.n) : '—'}</div><div class="l">${ult ? 'Últimas tarefas executadas · ' + fD(ult.data) + ' · ' + nf(ult.sem) + ' nos últimos 7 dias' : 'Últimas tarefas · nenhuma executada ainda'}</div></div>
  </section>`;
}

let filtroOnda = null;
function ondas() {
  const m = new Map();
  D.clinicas.forEach(c => { const k = c.onda || 'Sem onda'; if (!m.has(k)) m.set(k, []); m.get(k).push(c); });
  return [...m.entries()].map(([nome, cs]) => {
    const conc = cs.reduce((s, c) => s + c.concluidas, 0), ap = cs.reduce((s, c) => s + c.aplicaveis, 0), cont = {};
    cs.forEach(c => { if (c.fim) cont[c.fim] = (cont[c.fim] || 0) + 1; });
    const top = Object.entries(cont).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? 1 : -1))[0];
    const ci = {};
    cs.forEach(c => { if (c.inicio) ci[c.inicio] = (ci[c.inicio] || 0) + 1; });
    const ti = Object.entries(ci).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1))[0];
    return {nome, cs, conc, ap, pct: ap ? conc / ap : 0, prazo: top ? top[0] : null, inicio: ti ? ti[0] : null, esp: esp(cs),
      feitas: cs.filter(c => c.aplicaveis && c.concluidas === c.aplicaveis).length};
  }).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
}
function filtrarOnda(i) {
  const o = ondas()[i]; filtroOnda = filtroOnda === o.nome ? null : o.nome;
  $('#app').innerHTML = viewG();
}
function viewG() {
  const os = ondas();
  const cs = [...D.clinicas].filter(c => !filtroOnda || (c.onda || 'Sem onda') === filtroOnda).sort((a, b) => (a.onda || 'zzz').localeCompare(b.onda || 'zzz', 'pt-BR', {numeric: true}) || a.nome.localeCompare(b.nome, 'pt-BR'));
  const rows = cs.map(c => `<a class="brow" href="#/c/${encodeURIComponent(c.id)}"><span class="nm">${esc(c.nome)}<small>${esc(c.onda || '')}</small></span>${barra(c.pct, espC(c))}<span class="bv">${P(c.pct)}%</span><span class="bx">${c.concluidas}/${c.aplicaveis}</span></a>`).join('');
  const cards = os.map((o, i) => `<button type="button" class="onda${filtroOnda === o.nome ? ' on' : ''}" onclick="filtrarOnda(${i})"><div class="t"><b>${esc(o.nome)}</b><span>${P(o.pct)}%</span></div>${barra(o.pct, o.esp)}<div class="s">${o.cs.length} clínicas · ${o.feitas} concluídas · ${o.conc}/${o.ap} atividades${o.esp === null ? '' : ' · esperado da semana ' + P(o.esp) + '%'}</div><div class="pz">${o.inicio ? 'Início: ' + fD(o.inicio) + ' · ' : ''}${o.prazo ? 'Fim: ' + fD(o.prazo) : 'Fim a definir'}</div></button>`).join('');
  const limpar = filtroOnda ? `<button type="button" class="lnk" onclick="filtrarOnda(${os.findIndex(o => o.nome === filtroOnda)})">ver todas as ondas</button>` : '';
  return kpiG() + `<section class="blk" style="padding-bottom:6px"><h3>Evolução por onda</h3><div class="sub2">Clique numa onda para filtrar as clínicas abaixo</div><div class="ondas">${cards}</div></section>`
    + `<section class="blk"><h3>Evolução por clínica${filtroOnda ? ' · ' + esc(filtroOnda) : ''}${limpar}</h3><div class="sub2">Ordenado por onda e, dentro de cada uma, por ordem alfabética · clique numa clínica para ver o checklist dela${esp(D.clinicas) === null ? '' : '<span class="lg"><i></i>realizado</span><span class="lg"><i class="e"></i>esperado pelo cronograma</span>'}</div><div class="rank" style="--rows:${Math.ceil(cs.length / 2)}">${rows}</div></section>`;
}

function porTipo(c) {
  const r = {Execução: [0, 0], Evidência: [0, 0]};
  D.atividades.forEach((a, i) => {
    const s = c.status[i]; if (s === 'NA') return;
    const k = a.tipo === 'Evidência' ? 'Evidência' : 'Execução';
    r[k][1]++; if (s) r[k][0]++;
  });
  return r;
}

let abaC = 'exec', abaDe = null;
function setAba(a) { abaC = a; const c = rota(); if (c) { const y = window.scrollY; $('#app').innerHTML = viewC(c); window.scrollTo(0, y); } }
function viewC(c) {
  const t = porTipo(c);
  const meta = [c.cidade && c.uf ? c.cidade + ' - ' + c.uf : '', c.cadeiras ? c.cadeiras + ' cadeiras' : '', c.onda, c.escopo].filter(Boolean).map(esc).join(' · ');
  const janela = [c.inicio ? 'Início: ' + fD(c.inicio) : '', c.fim ? 'Fim: ' + fD(c.fim) : ''].filter(Boolean).join(' · ');
  if (abaDe !== c.id) { abaC = 'exec'; abaDe = c.id; }
  const ex = D.extras || {internas: [], evidencias: []};
  const linha = (n, texto, prev, s, extra) => {
    const k = s === 'NA' ? 'na' : s ? 'ok' : 'pd';
    return `<div class="it ${k}${extra || ''}"><span class="dot"></span><span class="n">${n}</span><span class="tx">${esc(texto)}</span><span class="pv">${prev ? fD(prev) : ''}</span><span class="dt">${s === 'NA' ? 'N/A' : s ? fD(s) : 'pendente'}</span></div>`;
  };
  const cont = sts => { const v = sts.filter(x => x !== 'NA'); return [v.filter(Boolean).length, v.length]; };
  const gi = c.int || {status: [], previsto: null}, ge = c.ev || {status: [], previsto: null};
  const nInt = cont(gi.status);
  const co = c.org || null, orgFeita = !!co && co.n > 0 && co.feitas >= co.n;
  const nEv = (() => { const b = cont(ge.status); return co && co.n > 0 ? [b[0] + (orgFeita ? 1 : 0), b[1] + 1] : b; })();
  let titulo = 'Execução', itens;
  if (abaC === 'int' && ex.internas.length) {
    titulo = 'Atividades internas';
    itens = ex.internas.map((a, i) => linha('', a.texto, gi.previsto && gi.previsto[i], gi.status[i])).join('');
  } else if (abaC === 'ev' && ex.evidencias.length) {
    titulo = 'Evidências';
    const feito = nEv[1] > 0 && nEv[0] === nEv[1];      // o check do grupo só vem quando todas as evidências estão feitas
    const pai = `<div class="it pai ${feito ? 'ok' : 'pd'}"><span class="dot"></span><span class="n"></span><span class="tx">Evidências<span class="cnt">${nEv[0]}/${nEv[1]}</span></span><span class="pv"></span><span class="dt">${feito ? 'completas' : 'pendente'}</span></div>`;
    itens = pai + ex.evidencias.map((a, i) => {
      if (a.org) {   // Organização: uma por visita; mostra x/N e a data da organização mais recente
        if (!co) return '';
        const k = orgFeita ? 'ok' : 'pd';
        return `<div class="it ${k} sub"><span class="dot"></span><span class="n"></span><span class="tx">${esc(a.texto)}<span class="cnt">${co.feitas}/${co.n}</span></span><span class="pv"></span><span class="dt">${co.ultima ? fD(co.ultima) : 'pendente'}</span></div>`;
      }
      return linha('', a.texto, ge.previsto && ge.previsto[i], ge.status[i], ' sub');
    }).join('');
  } else {
    abaC = 'exec';
    itens = D.atividades.map((a, i) => linha(a.n, a.texto, c.previsto && c.previsto[i], c.status[i])).join('');
  }
  const nEx = cont(c.status);
  const abas = ex.internas.length || ex.evidencias.length
    ? `<div class="abas"><button type="button" class="aba${abaC === 'exec' ? ' on' : ''}" onclick="setAba('exec')">Execução<b>${nEx[0]}/${nEx[1]}</b></button>`
      + `<button type="button" class="aba${abaC === 'int' ? ' on' : ''}" onclick="setAba('int')">Atividades internas<b>${nInt[0]}/${nInt[1]}</b></button>`
      + `<button type="button" class="aba${abaC === 'ev' ? ' on' : ''}" onclick="setAba('ev')">Evidências<b>${nEv[0]}/${nEv[1]}</b></button></div>` : '';
  return `<section class="blk"><a class="back" href="#/">← Visão geral</a>
  <div class="ch"><div class="top"><div><h2>${esc(c.nome)}</h2><div class="meta">${meta}<br>${esc(janela)}</div></div>
  <div class="big">${P(c.pct)}%<small>${c.concluidas} de ${c.aplicaveis} atividades${espC(c) === null ? '' : '<br>esperado da semana ' + P(espC(c)) + '%'}</small></div></div>
  ${barra(c.pct, espC(c))}${espC(c) === null ? '' : '<div class="sub2" style="margin:8px 0 0"><span class="lg" style="margin-left:0"><i></i>realizado</span><span class="lg"><i class="e"></i>esperado pelo cronograma</span></div>'}</div>
  <div class="g2">
   <div class="note"><b>Última atividade executada</b>${c.ultima ? esc(c.ultima.texto) + '<span>' + fD(c.ultima.data) + '</span>' : 'Nenhuma ainda'}</div>
   <div class="note n2"><b>Próxima pendente</b>${c.proxima ? esc(c.proxima.texto) : 'Tudo concluído'}</div>
  </div>
  <h3 style="margin-bottom:12px">${titulo}</h3>${abas}<div class="list"><div class="it lh"><span></span><span></span><span>Atividade</span><span class="pv">Data prevista</span><span class="dt">Execução</span></div>${itens}</div></section>`;
}

function render() {
  if (!D) return;
  const c = rota();
  if (location.hash.startsWith('#/c/') && !c) { location.hash = '#/'; return; }
  $('#app').innerHTML = c ? viewC(c) : viewG();
  document.title = (c ? c.nome + ' · ' : '') + 'Checklist das Clínicas · Grupo Taking';
  const g = new Date(D.gerado_em);
  $('#snap').innerHTML = 'Atualizado em <b>' + g.toLocaleDateString('pt-BR') + ' ' + g.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'}) + '</b><br>' + nf(D.geral.aplicaveis) + ' atividades · ' + D.geral.clinicas_total + ' clínicas';
  $('#f2').textContent = 'SNAPSHOT ' + g.toLocaleDateString('pt-BR') + ' · FONTE: ' + String(D.fonte).toUpperCase();
  window.scrollTo(0, 0);
}

async function carregar(primeira) {
  try {
    const r = await fetch('dados.json?' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    const novo = await r.json();
    const mudou = !D || novo.gerado_em !== D.gerado_em;
    D = novo;
    if (primeira) {
      $('#cl').innerHTML = D.clinicas.map(c => `<option value="${esc(c.nome)}">`).join('');
    }
    if (mudou) { const y = window.scrollY; render(); if (!primeira) window.scrollTo(0, y); }
  } catch (e) {
    if (!D) $('#app').innerHTML = '<div class="empty">Não foi possível carregar o <b>dados.json</b>.<br>Abra esta página pelo servidor (servidor.py) ou rode o sync_dados.py para gerar os dados.</div>';
  }
}

$('#q').addEventListener('change', () => {
  if (!D) return;
  const v = norm($('#q').value);
  if (!v) { location.hash = '#/'; return; }
  const c = D.clinicas.find(x => norm(x.nome) === v) || D.clinicas.find(x => norm(x.nome).includes(v));
  if (c) location.hash = '#/c/' + encodeURIComponent(c.id);
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') $('#q').dispatchEvent(new Event('change')); });
window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#/c/')) $('#q').value = ''; render(); });

async function exportar() {
  if (!D) return;
  if (typeof html2canvas === 'undefined' || !window.jspdf) { alert('Não foi possível carregar o gerador de PDF. Recarregue a página (Ctrl+F5) e tente de novo.'); return; }
  const btn = $('#exp'), txt = btn.textContent, c = rota(), hoje = new Date().toISOString().slice(0, 10);
  btn.textContent = 'Gerando PDF…';
  try {
    await new Promise(r => setTimeout(r, 30));
    const cv = await html2canvas(document.body, {
      scale: 2, windowWidth: 1417, backgroundColor: '#ffffff', useCORS: true, logging: false,
      onclone: doc => doc.body.classList.add('pdf')
    });
    const W = 1417, H = Math.round(cv.height / cv.width * W);
    const pdf = new window.jspdf.jsPDF({orientation: W > H ? 'l' : 'p', unit: 'px', format: [W, H], hotfixes: ['px_scaling'], compress: true});
    pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, H);
    pdf.save((c ? 'Checklist_' + c.id : 'Checklist_Clinicas_Visao_Geral') + '_' + hoje + '.pdf');
  } catch (e) {
    console.error(e); alert('Não foi possível gerar o PDF: ' + e.message);
  } finally { btn.textContent = txt; }
}
$('#exp').addEventListener('click', exportar);

carregar(true);
setInterval(() => carregar(false), 20000);
</script>
</body>
